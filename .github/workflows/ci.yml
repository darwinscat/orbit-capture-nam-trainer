name: ci

# Build, vet, and race-test on every PR and on pushes to main — the merge gate.
on:
  pull_request:
  push:
    branches: [ main ]

# The job token gets only what this workflow needs: it checks out and builds, it never
# writes to the repository. CodeQL's one finding in this family, ever, was a workflow
# without this block.
permissions:
  contents: read

# One live run per branch or pull request: a push on top of a push cancels the run it
# replaced instead of finishing it against code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest   # mac-first: the target platform
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # Linux is a shipping target (amd64/arm64 tarballs) — compile the !darwin
      # build-tagged code at PR time, not first-time at a release tag.
      - run: GOOS=linux GOARCH=amd64 go build ./... && GOOS=linux GOARCH=arm64 go build ./... && GOOS=linux go vet ./...
